backend spu_nap_spu_main_service_AWS_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_spu_main_service_AWS_ 1 nap_spu_main_service_AWS:5000 check resolvers docker init-addr none

