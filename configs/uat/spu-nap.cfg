backend spu_nap_main_service_UAT
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_spu_main_service_UAT_ 1 nap_spu_main_service_UAT:5000 check resolvers docker init-addr none

