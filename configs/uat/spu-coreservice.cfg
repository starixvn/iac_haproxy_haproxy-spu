mode tcp
log global
option tcplog
option tcp-check
default_backend spu_CTS.Portal.API_be

backend spu_CTS.Portal.API_be
mode tcp
balance source
server 10.2.190.81_tcp_7710 10.2.190.81:7710 check 
server 10.2.190.82_tcp_7710 10.2.190.82:7710 check backup
