frontend spu_testing_fe_local_tcp    
	bind *:5673	ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
	mode tcp
	option tcp-check
    tcp-request inspect-delay 10s
    tcp-request content accept if { req_ssl_hello_type 1 }
	default_backend spu_testing_be_local_tcp
	
backend spu_testing_be_local_tcp	 
	mode tcp	
	option ssl-hello-chk
    server test_tcp_server_local 10.70.70.81:8443 check inter 2000 rise 2 fall 5

