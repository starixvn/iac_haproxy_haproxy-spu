	bind *:5673
	mode tcp	
	option tcplog    
	tcp-request inspect-delay 2s #slow down each request by 2seconds
    tcp-request content accept if HTTP
	default_backend spu_testing_be_local_tcp
	
backend spu_testing_be_local_tcp	 
	mode tcp		
    server test_tcp_server_local 10.70.70.81:8443 send-proxy

