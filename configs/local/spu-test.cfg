frontend spu_testing_fe_local_http
    mode tcp
	bind *:6344		
    tcp-request inspect-delay 5s
    tcp-request content accept #if HTTP
    use_backend spu_testing_be_local_http if HTTP
    use_backend spu_testing_be_local_tcp if !HTTP
	
backend spu_testing_be_local_tcp	 
	mode tcp	
    server test_tcp_server_local 10.70.70.81:8443 check
	
backend spu_testing_be_local_http	 
	mode http	
    server test_http_server_local 10.70.70.81:8090
