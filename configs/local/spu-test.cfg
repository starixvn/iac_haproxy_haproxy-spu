frontend spu_testing_fe_local_http
    mode tcp
	bind *:6344	ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
	bind *:443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req_ssl_hello_type 1 }
	default_backend spu_testing_be_local_http
	
backend spu_testing_be_local_http	 
	mode tcp	
    server test_be_local 10.70.70.81:8443 check
