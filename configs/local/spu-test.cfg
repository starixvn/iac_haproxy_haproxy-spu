frontend spu_testing_fe_local
    bind *:8443 #ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    option http-server-close
    option forwardfor
    http-request add-header X-Forwarded-Proto https
    http-request add-header X-Forwarded-Port 8443
	default_backend spu_testing_be_local

backend spu_testing_be_local
    mode http
    balance roundrobin
    option ssl-hello-chk
    stick-table type binary len 32 size 30k expire 30m
    stick on ssl_fc_session_id
    server test_be_local 10.70.70.81:443 ssl verify none maxconn 5000
