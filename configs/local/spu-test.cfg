frontend spu_testing_fe_local_http
    mode http
	bind *:6344 ssl crt /usr/local/etc/haproxy/nexdev.net.pem
	http-request redirect scheme https code 301 unless { ssl_fc }   
	default_backend spu_testing_be_local_http
	
backend spu_testing_be_local_http
    redirect scheme https if !{ ssl_fc }  	
    server test_be_local 10.70.70.81:443 ssl verify none alpn h2,http/1.1
