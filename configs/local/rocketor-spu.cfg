

backend spu_fps_fp_api_evolution_service_LOCAL_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/evolution[/]?,/)]
    server-template fps_fp_api_evolution_service_LOCAL_ 1 fps_fp_api_evolution_service_LOCAL:5000 check resolvers docker init-addr none

