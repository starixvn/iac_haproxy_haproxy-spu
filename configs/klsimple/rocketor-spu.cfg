

backend spu_nap_spu_vr_job_service_KLSIMPLE_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    server-template nap_spu_vr_job_service_KLSIMPLE_ 1 nap_spu_vr_job_service_KLSIMPLE:5000 check resolvers docker init-addr none

backend spu_nap_spu_cts_portalapi_KLSIMPLE_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    http-request set-path %[path,regsub(^/swagger[/]?,/,i)]
    server-template nap_spu_cts_portalapi_KLSIMPLE_ 1 nap_spu_cts_portalapi_KLSIMPLE:5000 check resolvers docker init-addr none
