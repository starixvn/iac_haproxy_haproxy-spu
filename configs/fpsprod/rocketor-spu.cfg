

backend spu_fps_fp_api_job_service_FPSPROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/jobapi[/]?,/)]
    server-template fps_fp_api_job_service_FPSPROD_ 1 fps_fp_api_job_service_FPSPROD:5000 check resolvers docker init-addr none

