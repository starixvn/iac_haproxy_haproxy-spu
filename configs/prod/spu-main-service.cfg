backend nap_spu_main_service_PROD_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_spu_main_service_PROD_ 1 nap_spu_main_service_PROD:5000 check resolvers docker init-addr none

