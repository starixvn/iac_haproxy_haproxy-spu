backend spu_aiml_ss_airflow_webserver_prod
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.48_8080 10.2.27.48:8080 check


backend spu_aiml_llm_ollama_webserver_prod
    option forwardfor
    timeout server 60s
    option http-keep-alive
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.48_8090 10.2.27.48:8090 check


